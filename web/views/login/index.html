<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷电风格射击游戏</title>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            background: radial-gradient(circle at top, #102145, #050914 70%);
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .game-wrap {
            width: min(92vw, 520px);
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #8be9fd;
            letter-spacing: 2px;
        }
        p {
            margin: 6px 0 14px;
            color: #d0e5ff;
            font-size: 14px;
        }
        canvas {
            width: 100%;
            aspect-ratio: 2 / 3;
            border: 2px solid #42a5f5;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(66, 165, 245, 0.45);
            background: linear-gradient(#091426, #02070f 45%, #030b1a);
            touch-action: none;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            color: #fff;
            background: #1565c0;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1e88e5; }
        .tip { opacity: 0.9; font-size: 13px; }
    </style>
</head>
<body>
<div class="game-wrap">
    <h1>⚡ 星河雷电</h1>
    <p>方向键/拖拽移动，空格自动连发，击落敌机拿高分！</p>
    <canvas id="game" width="480" height="720"></canvas>
    <div class="actions">
        <button id="startBtn">开始游戏</button>
        <button id="restartBtn">重新开始</button>
    </div>
    <p class="tip">提示：生命归零即失败，点击“重新开始”再战。</p>
</div>

<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const keys = new Set();
    const stars = Array.from({ length: 70 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        v: 1 + Math.random() * 2
    }));

    const state = {
        running: false,
        score: 0,
        hp: 3,
        fireTick: 0,
        enemyTick: 0,
        player: { x: W / 2, y: H - 90, r: 18, speed: 5 },
        bullets: [],
        enemies: [],
        effects: []
    };

    function resetGame() {
        state.running = true;
        state.score = 0;
        state.hp = 3;
        state.fireTick = 0;
        state.enemyTick = 0;
        state.player.x = W / 2;
        state.player.y = H - 90;
        state.bullets = [];
        state.enemies = [];
        state.effects = [];
    }

    function spawnEnemy() {
        const r = 14 + Math.random() * 16;
        state.enemies.push({
            x: 30 + Math.random() * (W - 60),
            y: -30,
            r,
            speed: 1.5 + Math.random() * 2.2,
            hp: r > 25 ? 3 : 1
        });
    }

    function shoot() {
        state.bullets.push({ x: state.player.x, y: state.player.y - 18, r: 5, v: 8 });
    }

    function hitCircle(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const rr = a.r + b.r;
        return dx * dx + dy * dy <= rr * rr;
    }

    function update() {
        if (!state.running) return;

        if (keys.has('ArrowLeft')) state.player.x -= state.player.speed;
        if (keys.has('ArrowRight')) state.player.x += state.player.speed;
        if (keys.has('ArrowUp')) state.player.y -= state.player.speed;
        if (keys.has('ArrowDown')) state.player.y += state.player.speed;
        state.player.x = Math.max(20, Math.min(W - 20, state.player.x));
        state.player.y = Math.max(20, Math.min(H - 20, state.player.y));

        state.fireTick++;
        if (state.fireTick >= 8) {
            shoot();
            state.fireTick = 0;
        }

        state.enemyTick++;
        if (state.enemyTick >= 24) {
            spawnEnemy();
            state.enemyTick = 0;
        }

        for (const s of stars) {
            s.y += s.v;
            if (s.y > H) {
                s.y = 0;
                s.x = Math.random() * W;
            }
        }

        state.bullets.forEach(b => b.y -= b.v);
        state.enemies.forEach(e => e.y += e.speed);
        state.effects.forEach(f => f.t--);

        for (const b of state.bullets) {
            for (const e of state.enemies) {
                if (e.hp > 0 && hitCircle(b, e)) {
                    b.y = -100;
                    e.hp--;
                    if (e.hp <= 0) {
                        e.y = H + 100;
                        state.score += 10;
                        state.effects.push({ x: e.x, y: e.y, t: 12 });
                    }
                    break;
                }
            }
        }

        for (const e of state.enemies) {
            if (hitCircle(e, state.player) || e.y > H + 30) {
                if (e.y <= H + 30) state.hp--;
                e.y = H + 100;
            }
        }

        state.bullets = state.bullets.filter(b => b.y > -20);
        state.enemies = state.enemies.filter(e => e.y < H + 40);
        state.effects = state.effects.filter(f => f.t > 0);

        if (state.hp <= 0) state.running = false;
    }

    function drawPlayer() {
        const p = state.player;
        ctx.fillStyle = '#64b5f6';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 22);
        ctx.lineTo(p.x - 16, p.y + 18);
        ctx.lineTo(p.x, p.y + 10);
        ctx.lineTo(p.x + 16, p.y + 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#bbdefb';
        ctx.fillRect(p.x - 3, p.y - 10, 6, 18);
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
            ctx.fillStyle = 'rgba(189,224,255,0.8)';
            ctx.fillRect(s.x, s.y, 2, 2);
        }

        ctx.fillStyle = '#ffeb3b';
        for (const b of state.bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
        }

        for (const e of state.enemies) {
            ctx.fillStyle = e.hp > 1 ? '#ff7043' : '#ef5350';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x - 8, e.y - 3, 16, 6);
        }

        for (const f of state.effects) {
            ctx.strokeStyle = `rgba(255, 215, 64, ${f.t / 12})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(f.x, f.y, (12 - f.t) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }

        drawPlayer();

        ctx.fillStyle = '#e3f2fd';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(`分数: ${state.score}`, 18, 36);
        ctx.fillText(`生命: ${state.hp}`, 18, 68);

        if (!state.running) {
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 40px sans-serif';
            ctx.fillText(state.hp <= 0 ? '游戏结束' : '点击开始', W / 2, H / 2 - 10);
            ctx.font = '22px sans-serif';
            ctx.fillText(`最终得分 ${state.score}`, W / 2, H / 2 + 30);
            ctx.textAlign = 'left';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => keys.add(e.key));
    window.addEventListener('keyup', e => keys.delete(e.key));

    let dragging = false;
    canvas.addEventListener('pointerdown', e => {
        dragging = true;
        canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointerup', () => dragging = false);
    canvas.addEventListener('pointermove', e => {
        if (!dragging) return;
        const rect = canvas.getBoundingClientRect();
        state.player.x = (e.clientX - rect.left) * (W / rect.width);
        state.player.y = (e.clientY - rect.top) * (H / rect.height);
    });

    document.getElementById('startBtn').addEventListener('click', () => {
        if (!state.running) resetGame();
    });
    document.getElementById('restartBtn').addEventListener('click', resetGame);

    draw();
    loop();
})();
</script>
</body>
</html>
